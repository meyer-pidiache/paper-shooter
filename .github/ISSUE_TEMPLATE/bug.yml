name: Bug report
description: Report something that is not working as expected.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps from opening the game to seeing the bug.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
      description: Describe what happened and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include relevant details such as browser, device, map, solo or multiplayer, and whether it happens on another network. Attach a screenshot or recording if it helps.
