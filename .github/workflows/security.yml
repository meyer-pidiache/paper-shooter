name: Security Scan

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base branch or commit to diff against (e.g. origin/main or a SHA)
        required: true
        default: origin/main
        type: string

env:
  # Keep STRIX_VERSION and STRIX_SHA256 in sync when upgrading.
  STRIX_VERSION: 1.7.1
  STRIX_SHA256: c8e836251578baa228afe9e65f4a901ef6ae1116c444f8f0a67f7ae7898c480f

jobs:
  strix-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      report-uploaded: ${{ steps.upload_report.outputs.artifact-id != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: |
          archive="strix-$STRIX_VERSION-linux-x86_64"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 \
            -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/usestrix/strix/releases/download/v$STRIX_VERSION/$archive.tar.gz"
          echo "$STRIX_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/strix/bin"
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP/strix"
          install -m 0755 "$RUNNER_TEMP/strix/$archive" "$RUNNER_TEMP/strix/bin/strix"
          echo "$RUNNER_TEMP/strix/bin" >> "$GITHUB_PATH"

      - name: Run Security Scan
        env:
          STRIX_LLM: auto
          LLM_API_BASE: ${{ vars.OMNIROUTE_BASE_URL }}
          LLM_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          STRIX_DIFF_BASE: ${{ inputs.base || format('origin/{0}', github.base_ref) }}
        run: strix -n -t ./ --scan-mode quick --diff-base "$STRIX_DIFF_BASE"

      - name: Upload Strix report
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-report
          path: strix_runs/
          if-no-files-found: ignore
          retention-days: 14

  upload-sarif:
    needs: strix-scan
    if: >-
      always() &&
      needs.strix-scan.outputs.report-uploaded == 'true' &&
      vars.STRIX_SARIF_UPLOAD == 'true'
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: strix-report
          path: strix_runs

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs/
          category: strix
