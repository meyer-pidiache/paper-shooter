name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: pnpm install --frozen-lockfile
      - name: Build client
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_LOBBY_NAMESPACE: ${{ vars.VITE_LOBBY_NAMESPACE }}
          VITE_TURN_CREDENTIALS_URL: ${{ vars.VITE_TURN_CREDENTIALS_URL }}
        run: |
          if [ -z "$VITE_LOBBY_NAMESPACE" ]; then
            repo_hash=$(printf '%s' "$GITHUB_REPOSITORY" | sha256sum | cut -c1-16)
            export VITE_LOBBY_NAMESPACE="paper-pages-$repo_hash-"
          fi
          pnpm build:client --base "${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
